<!--
  Fósforo — o recurso mais valioso, o que brilha.

  Cristal luminoso com halo. É o único ícone do conjunto com brilho externo, e
  isso é proposital: numa lista de quatro, o item raro tem de se destacar antes
  de o jogador ler o nome.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Fósforo">
  <title>Fósforo</title>
  <defs>
    <radialGradient id="brilho-fosforo" cx="50%" cy="52%" r="50%">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity="0.85" />
      <stop offset="55%" stop-color="#ffab35" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffab35" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="24" cy="25" r="22" fill="url(#brilho-fosforo)" />
  <!-- cristal em losango alongado -->
  <path d="M24 4 L34 20 L24 44 L14 20 Z" fill="#f08a12" />
  <path d="M24 4 L34 20 L24 44 Z" fill="#ffab35" />
  <path d="M24 9 L29 20 L24 34 L19 20 Z" fill="#ffe0a3" opacity="0.85" />
  <!-- fagulhas -->
  <g fill="#ffe9c2">
    <circle cx="38" cy="12" r="1.8" />
    <circle cx="10" cy="34" r="1.5" />
    <circle cx="40" cy="35" r="1.2" />
  </g>
</svg>
